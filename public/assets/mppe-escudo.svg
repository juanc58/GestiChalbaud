  <path d="M134 118 C148 92, 144 54, 124 30" fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="20" cy="95" rx="7" ry="4" transform="rotate(-35 20 95)" fill="#388E3C"/>
  <ellipse cx="18" cy="74" rx="7" ry="4" transform="rotate(-20 18 74)" fill="#388E3C"/>
