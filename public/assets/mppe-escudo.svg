  <circle cx="67" cy="87" r="2.6" fill="#FFFFFF"/>
  <circle cx="76" cy="85" r="2.6" fill="#FFFFFF"/>
  <circle cx="84" cy="85" r="2.6" fill="#FFFFFF"/>
  <circle cx="93" cy="87" r="2.6" fill="#FFFFFF"/>
  <circle cx="101" cy="91" r="2.6" fill="#FFFFFF"/>
  <circle cx="108" cy="98" r="2.6" fill="#FFFFFF"/>

  <!-- Stylized White Emblem Symbol in Red & Yellow Quarters -->
  <path d="M53 40 L65 40 L59 64 Z" fill="#FBC02D"/>
  <line x1="59" y1="36" x2="59" y2="66" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="92" y1="38" x2="110" y2="62" stroke="#1A237E" stroke-width="3"/>
